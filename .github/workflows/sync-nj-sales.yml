name: Sync NJ Home Sales

on:
  # Runs monthly on the 5th (NJ Treasury data is ~60 days behind, Q data drops ~45 days after quarter end)
  schedule:
    - cron: '0 9 5 * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NJ sales sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: override the data URL if NJ Treasury changes the file name
          # NJ_SR1A_URL: ${{ secrets.NJ_SR1A_URL }}
        run: node scripts/sync-nj-sales.mjs
